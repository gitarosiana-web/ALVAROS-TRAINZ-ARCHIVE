<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alvaros TRAINZ ARCHIVE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-crimson: #950200;
            --accent-gold: #beb637;
        }
        body {
            background-color: #0d0d0d;
            color: #e5e7eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .bg-crimson { background-color: var(--bg-crimson); }
        .text-gold { color: var(--accent-gold); }
        .border-gold { border-color: var(--accent-gold); }
        .bg-gold { background-color: var(--accent-gold); }
        .hover-gold:hover { color: var(--accent-gold); }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: var(--bg-crimson); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b80300; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-crimson border-b-2 border-gold shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid font-bold text-3xl text-gold fa-train"></i>
                <div>
                    <h1 class="text-2xl font-black tracking-wider uppercase text-white">Alvaros <span class="text-gold">TRAINZ ARCHIVE</span></h1>
                    <p class="text-xs text-gray-200">Official Locomotive & Dependency Content Hub</p>
                </div>
            </div>
            
            <button onclick="openAddModal()" class="bg-gold text-black px-4 py-2 rounded-lg font-bold hover:bg-yellow-400 transition flex items-center gap-2 shadow-md">
                <i class="fa-solid fa-plus"></i> Add New Model
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        
        <!-- Search & Filter Bar -->
        <div class="bg-neutral-900 border border-neutral-800 p-4 rounded-xl shadow-md mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" oninput="filterAssets()" placeholder="Search model name, KUID, or author..." 
                    class="w-full bg-neutral-800 text-white pl-10 pr-4 py-2 rounded-lg border border-neutral-700 focus:outline-none focus:border-gold transition">
            </div>

            <!-- Category Filter Tabs -->
            <div class="flex flex-wrap gap-2 justify-center" id="categoryFilter">
                <button onclick="setCategory('All')" class="cat-btn active bg-crimson text-white px-4 py-2 rounded-lg font-semibold text-sm transition">All Assets</button>
                <button onclick="setCategory('Bogeys')" class="cat-btn bg-neutral-800 text-gray-300 hover:text-white px-4 py-2 rounded-lg font-semibold text-sm transition">Bogeys</button>
                <button onclick="setCategory('Locomotives')" class="cat-btn bg-neutral-800 text-gray-300 hover:text-white px-4 py-2 rounded-lg font-semibold text-sm transition">Locomotives</button>
                <button onclick="setCategory('Rolling Stock')" class="cat-btn bg-neutral-800 text-gray-300 hover:text-white px-4 py-2 rounded-lg font-semibold text-sm transition">Rolling Stock</button>
                <button onclick="setCategory('Dependencies')" class="cat-btn bg-neutral-800 text-gray-300 hover:text-white px-4 py-2 rounded-lg font-semibold text-sm transition">Dependencies</button>
            </div>
        </div>

        <!-- Asset Grid -->
        <div id="assetGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Content Injected Here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <i class="fa-solid fa-box-open text-6xl text-neutral-600 mb-4"></i>
            <h3 class="text-xl font-bold text-gray-400">No models found</h3>
            <p class="text-gray-500 text-sm mt-1">Try adjusting your search or add a new model to the archive.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-neutral-900 border-t border-neutral-800 py-6 text-center text-xs text-gray-500">
        <p>Alvaros TRAINZ ARCHIVE &copy; 2026. Built for Trainz Railroad Simulator.</p>
    </footer>

    <!-- Add Model Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-neutral-900 border border-gold rounded-xl p-6 w-full max-w-lg shadow-2xl relative">
            <button onclick="closeAddModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="text-xl font-bold text-gold mb-4 flex items-center gap-2"><i class="fa-solid fa-file-circle-plus"></i> Add Model to Archive</h2>
            
            <form id="addForm" onsubmit="handleAddModel(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Asset Title</label>
                    <input type="text" id="modelTitle" required placeholder="e.g. Casey Driving Bogey" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-gold">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">KUID</label>
                        <input type="text" id="modelKuid" required placeholder="kuid:507467:100835" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-gold">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Category</label>
                        <select id="modelCategory" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-gold">
                            <option value="Bogeys">Bogeys</option>
                            <option value="Locomotives">Locomotives</option>
                            <option value="Rolling Stock">Rolling Stock</option>
                            <option value="Dependencies">Dependencies</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Author</label>
                    <input type="text" id="modelAuthor" placeholder="Alvaro" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-gold">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Download URL / Google Drive Link</label>
                    <input type="url" id="modelLink" required placeholder="https://drive.google.com/..." class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-gold">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Config Details / Notes</label>
                    <textarea id="modelConfig" rows="3" placeholder="kind bogey&#10;trainz-build 4.5..." class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-xs font-mono text-white focus:outline-none focus:border-gold"></textarea>
                </div>
                <button type="submit" class="w-full bg-crimson hover:bg-red-700 text-white font-bold py-2 rounded-lg transition shadow-md">Add to Archive</button>
            </form>
        </div>
    </div>

    <!-- Script Data & Logic -->
    <script>
        // Initial Dataset
        let assets = [
            { id: 1, title: "Tangy Dependencies Package (Tangy_Deps.cdp)", kuid: "kuid:507467:100000", category: "Dependencies", author: "Alvaro", link: "https://drive.google.com/file/d/1es-Ebu9NCcvuFPUdU3evj-SyD6CCC3xz/view?usp=drive_link", config: "kind archive\npackage-version 1.0\nusername Tangy Dependencies" },
            { id: 2, title: "Casey Driving Bogey", kuid: "kuid:507467:100835", category: "Bogeys", author: "Alvaro", link: "https://drive.google.com/file/d/1lmcw0kgSwnq1HmluPLXbCy_JXlOxXI7F/view?usp=drive_link", config: "kind bogey\ntrainz-build 4.5\nusername Casey Driving Bogey" },
            { id: 3, title: "Casey Front Wheel Assembly", kuid: "kuid:507467:100834", category: "Bogeys", author: "Alvaro", link: "https://drive.google.com/file/d/1ccr39Jkkyv3g5jXQuqJA73Ao8fKrCtZ0/view?usp=drive_link", config: "kind bogey\ntrainz-build 4.5\nusername Casey Front Wheel" },
            { id: 4
